
services:
  api:
    build: .
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/measurements.log
      FIELD_TOKEN: "${FIELD_TOKEN:-dev-field-token}"
      CALIBRATION_TOKEN: "${CALIBRATION_TOKEN:-dev-calibration-token}"
      THIRD_PARTY_TOKEN: "${THIRD_PARTY_TOKEN:-dev-third-party-token}"
      OWNER_TOKEN: "${OWNER_TOKEN:-dev-owner-token}"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app-data:/data

volumes:
  app-data:
